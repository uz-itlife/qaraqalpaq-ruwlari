        z-index: 1000;
        display: flex;
        justify-content: space-between;

        backdrop-filter: blur(10px);
        height: 70px;

      .burger-menu { display: none; flex-direction: column; justify-content: space-around; width: 30px; height: 25px; background: transparent; border: none; cursor: pointer; padding: 0; z-index: 1001; }

      .burger-menu.active .burger-bar:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
      .burger-menu.active .burger-bar:nth-child(2) { opacity: 0; }
      .burger-menu.active .burger-bar:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }
      .view-switch {
        display: flex;
        gap: 0.5rem;
        background: rgba(255,255,255,0.1);
        padding: 0.25rem;
        border-radius: 20px;
        transition: all 0.3s ease;
      }
      .view-btn {
        padding: 0.5rem 1.5rem;
        border-radius: 16px;
        border: none;
        background: transparent;
        color: #8892b0;
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
        font-size: 0.9rem;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .view-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.1); }
      .view-btn.active { background: var(--gold); color: #000; font-weight: 600; max-width: 170px; text-align: center; margin: 0 auto; }
      .lang-switch { display: flex; align-items: center; gap: 0.5rem; margin-left: 1rem; padding-left: 1rem; border-left: 1px solid rgba(212,175,55,0.3); }
      
     
      
      .lang-btn1 { padding: 0.4rem; border-radius: 8px; background: transparent; color: var(--gold); cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.3s; text-decoration: none; display: flex; align-items: center; justify-content: center; }
      .lang-btn1 img { width: 2rem; height: 2rem; border-radius: 50%; vertical-align: middle; }
      .lang-btn { text-decoration: none; }
      .lang-btn.active { border: 1px solid var(--accent-red); display: flex; align-items: center; justify-content: center; border-radius: 8px; width: 2.9rem; height: 2.9rem; }
      .lang-btn.active img { width: 3rem; height: 3rem; border-radius: 50%; vertical-align: middle; }
      .lang-btn1.active { border: 1px solid var(--accent-red); width: 3rem; height: 3rem; }
      .lang-btn1.active img { width: 2rem; height: 2rem; }
      .lang-btn1:hover { border: 1px solid var(--gold); width: 3rem; height: 3rem; }


       .lang-btn img {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            vertical-align: middle;
        }
      .theme-toggle-btn, .fav-toggle-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); border-radius: 8px; padding: 0.3rem 0.6rem; cursor: pointer; font-size: 0.8rem; margin-left: 0.5rem; }
      .favorites-panel { display: none; }
      @media (max-width: 968px) {
        .burger-menu { display: flex; }
        .view-switch {
          position: fixed; top: 70px; left: 0; right: 0;
          background: rgba(10,12,16,0.98);
          flex-direction: column; padding: 1rem;
          border-bottom: 2px solid var(--gold); border-radius: 0;

        }
        .view-switch.active { transform: translateY(0); opacity: 1; visibility: visible; }
        .view-btn { width: 100%; text-align: center; padding: 6px 8px; }
        header { padding: 0.5rem 1rem; }

      /* Stats page specific */
      .kpi-row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        padding: 16px 20px;
      }
      .kpi-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px 24px;
        text-align: center;
        min-width: 120px;
      }
      .kpi-value {
        font-size: 2rem;
        font-weight: bold;
        color: var(--gold);
      }
      .kpi-label {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-top: 4px;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 20px;
        padding: 0 20px 30px;
        max-width: 1400px;
        margin: 0 auto;

      .stats-card {
        background: rgba(255,255,255,0.04);

        border-radius: 12px;
        padding: 20px;
      }
      .stats-card h3 {
        color: var(--accent-yellow);
        margin-bottom: 16px;
        font-size: 1rem;
        text-align: center;

  const CHART_COLORS = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#1abc9c','#e91e63','#ff9800','#00bcd4'];

  function _getAllNodes(node, arr) {
    if (!arr) arr = [];
    arr.push(node);
    const kids = node.children || node.ballar || [];
    kids.forEach(c => _getAllNodes(c, arr));
    return arr;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const all = _getAllNodes(treeData);

    const kpiData = [
      { v: all.filter(n => (n.level||0) === 1).length, l: 'Arıs' },
      { v: all.filter(n => (n.level||0) === 2).length, l: 'Bólim' },
      { v: all.filter(n => (n.level||0) === 3).length, l: 'Urıw' },
      { v: all.filter(n => (n.level||0) >= 4).length, l: 'Tiyre/ko\'she' },
      { v: all.filter(n => n.tamga || (n.info && n.info.tamga)).length, l: 'Tamƣalı' },
      { v: all.filter(n => n.uran  || (n.info && n.info.uran )).length,  l: 'Uranlı' },
    ];
    document.getElementById('kpiRow').innerHTML = kpiData.map(k =>
      `<div class="kpi-card"><div class="kpi-value">${k.v}</div><div class="kpi-label">${k.l}</div></div>`
    ).join('');

    const arisNodes = all.filter(n => (n.level||0) === 1);
    const isDark = !document.body.classList.contains('light-theme');
    const legendColor = isDark ? '#ecf0f1' : '#333';

    new Chart(document.getElementById('chartAris'), {
      type: 'pie',
      data: {
        labels: arisNodes.map(n => n.name || n.at || ''),
        datasets: [{ data: arisNodes.map(n => _getAllNodes(n).length),
          backgroundColor: CHART_COLORS }]
      },
      options: { plugins: { legend: { labels: { color: legendColor } } } }
    });

    const tribes = all.filter(n => (n.level||0) === 3)
      .map(n => ({ name: n.name || n.at || '', count: _getAllNodes(n).length - 1 }))
      .sort((a,b) => b.count - a.count).slice(0, 10);
    new Chart(document.getElementById('chartTopTribes'), {
      type: 'bar',
      data: {
        labels: tribes.map(t => t.name),
        datasets: [{ label: 'Urıwlar sanı', data: tribes.map(t => t.count),
          backgroundColor: '#3498db' }]
      },
      options: {
        indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#bdc3c7' }, grid: { color: '#2c3e50' } },
          y: { ticks: { color: '#ecf0f1', font: { size: 11 } }, grid: { color: '#2c3e50' } }
        }
      }
    });

    const typeCounts = {};
    all.forEach(n => { const t = n.type || n.tiri || n.turi || ''; if (t) typeCounts[t] = (typeCounts[t]||0)+1; });
    const typeEntries = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
    new Chart(document.getElementById('chartTypes'), {
      type: 'doughnut',
      data: {
        labels: typeEntries.map(e => e[0]),
        datasets: [{ data: typeEntries.map(e => e[1]), backgroundColor: CHART_COLORS }]
      },
      options: { plugins: { legend: { labels: { color: legendColor, boxWidth: 14, font: { size: 11 } } } } }
    });
  });
  </script>
  <script src="js/shared-features.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>

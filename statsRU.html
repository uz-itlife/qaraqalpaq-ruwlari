    ];
    document.getElementById('kpiRow').innerHTML = kpiData.map(k =>
      `<div class="kpi-card"><div class="kpi-value">${k.v}</div><div class="kpi-label">${k.l}</div></div>`
    ).join('');

    const arisNodes = all.filter(n => (n.level||0) === 1);
    const isDark = !document.body.classList.contains('light-theme');
    const legendColor = isDark ? '#ecf0f1' : '#333';

    new Chart(document.getElementById('chartAris'), {
      type: 'pie',
      data: {
        labels: arisNodes.map(n => n.name || n.at || ''),
        datasets: [{ data: arisNodes.map(n => _getAllNodes(n).length),
          backgroundColor: CHART_COLORS }]
      },
      options: { plugins: { legend: { labels: { color: legendColor } } } }
    });

    const tribes = all.filter(n => (n.level||0) === 3)
      .map(n => ({ name: n.name || n.at || '', count: _getAllNodes(n).length - 1 }))
      .sort((a,b) => b.count - a.count).slice(0, 10);
    new Chart(document.getElementById('chartTopTribes'), {
      type: 'bar',
      data: {
        labels: tribes.map(t => t.name),
        datasets: [{ label: 'Подродов', data: tribes.map(t => t.count),
          backgroundColor: '#3498db' }]
      },
      options: {
        indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#bdc3c7' }, grid: { color: '#2c3e50' } },
          y: { ticks: { color: '#ecf0f1', font: { size: 11 } }, grid: { color: '#2c3e50' } }
        }
      }
    });

    const typeCounts = {};
    all.forEach(n => { const t = n.type || n.tiri || n.turi || ''; if (t) typeCounts[t] = (typeCounts[t]||0)+1; });
    const typeEntries = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
    new Chart(document.getElementById('chartTypes'), {
      type: 'doughnut',
      data: {
        labels: typeEntries.map(e => e[0]),
        datasets: [{ data: typeEntries.map(e => e[1]), backgroundColor: CHART_COLORS }]
      },
      options: { plugins: { legend: { labels: { color: legendColor, boxWidth: 14, font: { size: 11 } } } } }
    });
  });
  </script>
  <script src="js/shared-features.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
